# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf}
  postgres: &postgres-image ${CONFLUENCE_POSTGRES_IMAGE_TAG:-postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94}
  confluence: &confluence-image ${CONFLUENCE_IMAGE_TAG:-atlassian/confluence:10.2.15@sha256:810903b01662b85cd511f5e3c7dfc334b5c2850cf73b62503800aff5448983f6}

networks:
  confluence-network:
    external: true
  traefik-network:
    external: true

volumes:
  confluence-data:
  confluence-postgres:
  confluence-postgres-backup:
  confluence-data-backups:
  confluence-database-backups:
  traefik-certificates:

services:
  postgres:
    image: *postgres-image
    volumes:
      - confluence-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${CONFLUENCE_DB_NAME:-confluencedb}
      POSTGRES_USER: ${CONFLUENCE_DB_USER:-confluencedbuser}
      POSTGRES_PASSWORD: ${CONFLUENCE_DB_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - confluence-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${CONFLUENCE_DB_NAME:-confluencedb}", "-U", "${CONFLUENCE_DB_USER:-confluencedbuser}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  confluence:
    image: *confluence-image
    volumes:
      - confluence-data:${DATA_PATH:-/var/atlassian/application-data/confluence}
    environment:
      JVM_MINIMUM_MEMORY: ${CONFLUENCE_JVM_MINIMUM_MEMORY:-8G}
      JVM_MAXIMUM_MEMORY: ${CONFLUENCE_JVM_MAXIMUM_MEMORY:-12G}
      ATL_PROXY_NAME: ${CONFLUENCE_HOSTNAME:?set in .env - see .env.example}
      ATL_TOMCAT_SECURE: 'true'
      ATL_TOMCAT_SCHEME: https
      ATL_PROXY_PORT: 443
      ATL_DB_TYPE: postgresql
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_JDBC_USER: ${CONFLUENCE_DB_USER:-confluencedbuser}
      ATL_JDBC_PASSWORD: ${CONFLUENCE_DB_PASSWORD}
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/${CONFLUENCE_DB_NAME:-confluencedb}
    networks:
      - confluence-network
      - traefik-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.confluence.rule=Host(`${CONFLUENCE_HOSTNAME}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.confluence.service=confluence"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.confluence.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.confluence.loadbalancer.server.port=8090"
      # Enable TLS on this router
      - "traefik.http.routers.confluence.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.confluence.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.confluence.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.confluence.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Define TCP router rules for Confluence Synchrony to match all incoming requests (HostSNI)
      - "traefik.tcp.routers.confluence-synchrony.rule=HostSNI(`*`)"
      # Assign the Confluence Synchrony router to a named Traefik service
      - "traefik.tcp.routers.confluence-synchrony.service=confluence-synchrony"
      # Use the 'Confluence Synchrony' (custom) entry point
      - "traefik.tcp.routers.confluence-synchrony.entrypoints=confluence-synchrony"
      # Define the internal container port for routing to the Confluence Synchrony service
      - "traefik.tcp.services.confluence-synchrony.loadbalancer.server.port=8091"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Define the Synchrony entry point on port 8091
      - "--entryPoints.confluence-synchrony.address=:8091"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
      - "8091:8091"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: *postgres-image
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$POSTGRES_BACKUPS_PATH/$$POSTGRES_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if pg_dump -h postgres -p 5432 -d $$CONFLUENCE_DB_NAME -U $$CONFLUENCE_DB_USER | gzip > "$$DB_FILE"; then
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        DATA_FILE="$$DATA_BACKUPS_PATH/$$DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE";
        if tar -zcpf "$$DATA_FILE" $$DATA_PATH; then
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${POSTGRES_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$POSTGRES_BACKUPS_PATH" -type f -name "$$POSTGRES_BACKUP_NAME-*" -mtime "+$$POSTGRES_BACKUP_PRUNE_DAYS" -delete;
        fi;
        if [ "$${DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$DATA_BACKUPS_PATH" -type f -name "$$DATA_BACKUP_NAME-*" -mtime "+$$DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$BACKUP_INTERVAL";
      done'
    volumes:
      - confluence-postgres-backup:/var/lib/postgresql/data
      - confluence-data:${DATA_PATH:-/var/atlassian/application-data/confluence}
      - confluence-data-backups:${DATA_BACKUPS_PATH:-/srv/confluence-application-data/backups}
      - confluence-database-backups:${POSTGRES_BACKUPS_PATH:-/srv/confluence-postgres/backups}
    environment:
      CONFLUENCE_DB_NAME: ${CONFLUENCE_DB_NAME:-confluencedb}
      CONFLUENCE_DB_USER: ${CONFLUENCE_DB_USER:-confluencedbuser}
      PGPASSWORD: ${CONFLUENCE_DB_PASSWORD}
      BACKUP_INIT_SLEEP: ${BACKUP_INIT_SLEEP:-30m}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      POSTGRES_BACKUP_PRUNE_DAYS: ${POSTGRES_BACKUP_PRUNE_DAYS:-7}
      DATA_BACKUP_PRUNE_DAYS: ${DATA_BACKUP_PRUNE_DAYS:-7}
      POSTGRES_BACKUPS_PATH: ${POSTGRES_BACKUPS_PATH:-/srv/confluence-postgres/backups}
      DATA_BACKUPS_PATH: ${DATA_BACKUPS_PATH:-/srv/confluence-application-data/backups}
      DATA_PATH: ${DATA_PATH:-/var/atlassian/application-data/confluence}
      POSTGRES_BACKUP_NAME: ${POSTGRES_BACKUP_NAME:-confluence-postgres-backup}
      DATA_BACKUP_NAME: ${DATA_BACKUP_NAME:-confluence-application-data-backup}
    networks:
      - confluence-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
